[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "housepricing-web-bff"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "google-cloud-storage",
    "google-cloud-secret-manager",
]

[tool.setuptools.packages.find]
where = ["src"]