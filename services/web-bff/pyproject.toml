[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "housepricing-web-bff"
version = "0.1.0"
description = "Backend-for-frontend for House Pricing"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "google-auth>=2.38,<3.0",
    "requests>=2.32,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]