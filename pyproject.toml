[project]
name = "housepricing-analysis"
version = "0.1.0"
description = "Cloud Run Job for collecting and analyzing Chilean property data"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-storage>=2.18,<3",
    "google-cloud-secret-manager>=2.21,<3",
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"