<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>House Pricing</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <script
    src="https://accounts.google.com/gsi/client"
    async
    defer
  ></script>

  <script
    src="./app.js"
    defer
  ></script>
</head>

<body>

  <main class="container py-5">

    <div class="row justify-content-center">

      <div class="col-12 col-lg-8">

        <!-- Header -->

        <header class="text-center mb-5">
          <h1 class="display-6">
            House Pricing
          </h1>

          <p class="text-body-secondary">
            Encuentra departamentos en Chile
          </p>
        </header>


        <!-- Google authentication -->

        <section
          id="google-login"
          class="card mb-4"
        >
          <div class="card-body text-center">

            <h2 class="h5 mb-3">
              Iniciar sesión
            </h2>

            <div
              id="google-signin-button"
              class="d-flex justify-content-center"
            ></div>

          </div>
        </section>


        <!-- Mercado Libre -->

        <section class="card mb-4">

          <div class="card-body">

            <h2 class="h5">
              Mercado Libre
            </h2>

            <p
              id="mercadolibre-status"
              class="text-body-secondary mb-3"
            >
              No conectado
            </p>

            <button
              id="mercadolibre-connect"
              type="button"
              class="btn btn-primary"
            >
              Conectar Mercado Libre
            </button>

          </div>

        </section>


        <!-- Searches -->

        <section class="card mb-4">

          <div class="card-body">

            <div
              class="d-flex justify-content-between align-items-center mb-3"
            >
              <h2 class="h5 mb-0">
                Mis búsquedas
              </h2>

              <button
                type="button"
                class="btn btn-outline-primary btn-sm"
              >
                Nueva búsqueda
              </button>
            </div>

            <div
              id="searches"
              class="text-body-secondary"
            >
              No hay búsquedas configuradas.
            </div>

          </div>

        </section>


        <!-- Result -->

        <section class="card">

          <div class="card-body">

            <h2 class="h6">
              Resultado
            </h2>

            <pre
              id="result"
              class="mb-0 small"
            ></pre>

          </div>

        </section>

      </div>

    </div>

  </main>


  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
  ></script>

</body>
</html>
